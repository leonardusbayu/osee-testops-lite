{
  "services": {
    "web": {
      "image": "${OSEE_CANDIDATE_IMAGE:?required}",
      "container_name": "${OSEE_CANDIDATE_NETWORK:?required}-web",
      "profiles": [
        "fixture",
        "local"
      ],
      "entrypoint": [
        "/app/web"
      ],
      "user": "65532:65532",
      "read_only": true,
      "restart": "unless-stopped",
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "networks": [
        "candidate"
      ],
      "env_file": [
        "${OSEE_CANDIDATE_ENV:?required}"
      ],
      "labels": {
        "osee.testops.candidate": "${OSEE_CANDIDATE_SCOPE:?required}",
        "osee.testops.role": "web",
        "osee.testops.profile": "${OSEE_CANDIDATE_PROFILE:?required}"
      },
      "tmpfs": [
        "/tmp:rw,nosuid,noexec,size=64m"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "kill -0 1"
        ],
        "interval": "3s",
        "timeout": "2s",
        "retries": 10
      },
      "volumes": [
        {
          "type": "bind",
          "source": "${OSEE_CANDIDATE_KEY:?required}",
          "target": "/run/secrets/staff-master.key",
          "read_only": true
        }
      ]
    },
    "worker": {
      "image": "${OSEE_CANDIDATE_IMAGE:?required}",
      "container_name": "${OSEE_CANDIDATE_NETWORK:?required}-worker",
      "profiles": [
        "fixture",
        "local"
      ],
      "entrypoint": [
        "/app/worker"
      ],
      "user": "65532:65532",
      "read_only": true,
      "restart": "unless-stopped",
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "networks": [
        "candidate"
      ],
      "env_file": [
        "${OSEE_CANDIDATE_ENV:?required}"
      ],
      "labels": {
        "osee.testops.candidate": "${OSEE_CANDIDATE_SCOPE:?required}",
        "osee.testops.role": "worker",
        "osee.testops.profile": "${OSEE_CANDIDATE_PROFILE:?required}"
      },
      "tmpfs": [
        "/tmp:rw,nosuid,noexec,size=64m"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "kill -0 1"
        ],
        "interval": "3s",
        "timeout": "2s",
        "retries": 10
      }
    },
    "gateway": {
      "image": "${OSEE_CANDIDATE_CADDY_IMAGE:?required}",
      "container_name": "${OSEE_CANDIDATE_NETWORK:?required}-gateway",
      "profiles": [
        "fixture",
        "local"
      ],
      "entrypoint": [
        "caddy",
        "reverse-proxy",
        "--from",
        "http://:8080",
        "--to",
        "http://web:8080"
      ],
      "user": "65532:65532",
      "read_only": true,
      "restart": "unless-stopped",
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "pids_limit": 128,
      "networks": {
        "candidate": {
          "priority": 100
        },
        "frontend": {
          "priority": 0
        }
      },
      "labels": {
        "osee.testops.candidate": "${OSEE_CANDIDATE_SCOPE:?required}",
        "osee.testops.role": "gateway",
        "osee.testops.profile": "${OSEE_CANDIDATE_PROFILE:?required}"
      },
      "tmpfs": [
        "/tmp:rw,nosuid,noexec,size=16m",
        "/config:rw,nosuid,noexec,size=16m",
        "/data:rw,nosuid,noexec,size=16m"
      ],
      "ports": [
        "127.0.0.1:8091:8080"
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "wget -q -T 2 --header='Host: localhost' -O - http://127.0.0.1:8080/health/ready >/dev/null"
        ],
        "interval": "3s",
        "timeout": "3s",
        "retries": 10
      }
    }
  },
  "networks": {
    "candidate": {
      "external": true,
      "name": "${OSEE_CANDIDATE_NETWORK:?required}"
    },
    "frontend": {
      "external": true,
      "name": "${OSEE_CANDIDATE_FRONTEND:?required}"
    }
  }
}

